<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Calculator | College Project</title>
    <link rel="stylesheet" href="style.css">
 </head>
<body>
    <div class="glass-container">
        <div class="calculator">
            <div class="display">
                <div id="prev-action"></div>
                <div id="result">0</div>
            </div>
            <div class="buttons">
                <button onclick="allClear()" class="col-2 btn-clear">AC</button>
                <button onclick="del()" class="btn-ctrl">DEL</button>
                <button onclick="setOp('/')" class="btn-op">÷</button>
                
                <button onclick="num('7')">7</button>
                <button onclick="num('8')">8</button>
                <button onclick="num('9')">9</button>
                <button onclick="setOp('*')" class="btn-op">×</button>
                
                <button onclick="num('4')">4</button>
                <button onclick="num('5')">5</button>
                <button onclick="num('6')">6</button>
                <button onclick="setOp('+')" class="btn-op">+</button>
                
                <button onclick="num('1')">1</button>
                <button onclick="num('2')">2</button>
                <button onclick="num('3')">3</button>
                <button onclick="setOp('-')" class="btn-op">−</button>
                
                <button onclick="num('.')">.</button>
                <button onclick="num('0')">0</button>
                <button onclick="calc()" class="col-2 btn-equal">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
